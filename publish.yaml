Edition: 3.0.0
Type: Project
Name: buy-me-a-coffee
Version: dev
Provider:
  - 阿里云
Description: 希希咖啡店——AgentRun A2A 协议多 Agent 案例
HomePage: https://github.com/devsapp/agentrun-template
Tags: #标签详情
  - AIGC
  - LLM
  - 智能体
  - deepseek
  - 通义千问
  - MCP
Category: 人工智能
# Organization: 函数计算（FC）
Service:
  函数计算:
    Authorities:
      - AliyunFCFullAccess
    Description: 函数调用服务
Effective: Public
Parameters:
  type: object
  additionalProperties: false
  required: # 必填项
    - region
    - agentRuntimeName
    - role
    - modelServiceName
    - modelName
  properties:
    region:
      title: 地域
      type: string
      default: cn-hangzhou
      description: 创建应用所在的地区
      enum:
        - cn-beijing
        - cn-hangzhou
    agentRuntimeName:
      title: AgentRun运行时唯一名称
      type: string
      default: 'buy-me-a-coffee'
      pattern: '^[a-zA-Z_][a-zA-Z0-9-_:/.]{0,127}$'
      description: agentrun的唯一名称
      x-hidden: true
      x-random: true
    role:
      title: 运行时角色
      type: string
      default: 'agentrun-role'
      description: AgentrRun运行时的全权限
      required: true
      x-role:
        name: agentrun-role # 角色名
        service: FC # 服务账号
        authorities:
          - AliyunAgentRunFullAccess
          - AliyunDevsReadOnlyAccess
    modelServiceName:
      title: 模型服务名称
      type: string
      pattern: '^[a-zA-Z_][a-zA-Z0-9-_:/.]{0,127}$'
      description: 填入AgentRun的模型服务名称
      x-agentrun-model-llm-provider-name: true

    modelName:
      title: 要使用的模型名称
      type: string
      description: 为了更好的效果，建议使用 qwen3-max，留空时自动选择列表中的第一个模型
      x-agentrun-model-llm: true
    