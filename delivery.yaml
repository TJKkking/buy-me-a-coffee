name: delivery-api
description: 送了么配送 API

spec:
  schema:
    type: OpenAPI
    detail: 
      openapi: 3.1.0
      info:
        title: 送了么配送后端服务
        description: 送了么配送的 REST API 服务，提供订单管理
        version: 1.0.0
      paths:
        /:
          get:
            summary: Root
            description: 健康检查
            operationId: root__get
            responses:
              "200":
                description: Successful Response
                content:
                  application/json:
                    schema: {}
        /health:
          get:
            summary: Health
            description: 健康检查
            operationId: health_health_get
            responses:
              "200":
                description: Successful Response
                content:
                  application/json:
                    schema: {}
        /api/delivery/deliveries:
          post:
            tags:
              - 送了么配送
            summary: Create Delivery
            description: 创建配送订单
            operationId: create_delivery_api_delivery_deliveries_post
            requestBody:
              required: true
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/CreateDeliveryRequest"
            responses:
              "200":
                description: Successful Response
                content:
                  application/json:
                    schema: {}
              "422":
                description: Validation Error
                content:
                  application/json:
                    schema:
                      $ref: "#/components/schemas/HTTPValidationError"
          get:
            tags:
              - 送了么配送
            summary: Get Deliveries
            description: 获取配送列表
            operationId: get_deliveries_api_delivery_deliveries_get
            parameters:
              - name: status
                in: query
                required: false
                schema:
                  anyOf:
                    - type: string
                    - type: "null"
                  title: Status
              - name: limit
                in: query
                required: false
                schema:
                  type: integer
                  default: 50
                  title: Limit
            responses:
              "200":
                description: Successful Response
                content:
                  application/json:
                    schema: {}
              "422":
                description: Validation Error
                content:
                  application/json:
                    schema:
                      $ref: "#/components/schemas/HTTPValidationError"
        /api/delivery/deliveries/{delivery_id}:
          get:
            tags:
              - 送了么配送
            summary: Get Delivery
            description: 获取配送详情
            operationId: get_delivery_api_delivery_deliveries__delivery_id__get
            parameters:
              - name: delivery_id
                in: path
                required: true
                schema:
                  type: integer
                  title: Delivery Id
            responses:
              "200":
                description: Successful Response
                content:
                  application/json:
                    schema: {}
              "422":
                description: Validation Error
                content:
                  application/json:
                    schema:
                      $ref: "#/components/schemas/HTTPValidationError"
        /api/delivery/deliveries/order/{order_id}:
          get:
            tags:
              - 送了么配送
            summary: Get Delivery By Order
            description: 根据订单 ID 获取配送信息
            operationId: get_delivery_by_order_api_delivery_deliveries_order__order_id__get
            parameters:
              - name: order_id
                in: path
                required: true
                schema:
                  type: integer
                  title: Order Id
            responses:
              "200":
                description: Successful Response
                content:
                  application/json:
                    schema: {}
              "422":
                description: Validation Error
                content:
                  application/json:
                    schema:
                      $ref: "#/components/schemas/HTTPValidationError"
        /api/delivery/deliveries/{delivery_id}/status:
          put:
            tags:
              - 送了么配送
            summary: Update Delivery Status
            description: 更新配送状态
            operationId: update_delivery_status_api_delivery_deliveries__delivery_id__status_put
            parameters:
              - name: delivery_id
                in: path
                required: true
                schema:
                  type: integer
                  title: Delivery Id
            requestBody:
              required: true
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/UpdateDeliveryStatusRequest"
            responses:
              "200":
                description: Successful Response
                content:
                  application/json:
                    schema: {}
              "422":
                description: Validation Error
                content:
                  application/json:
                    schema:
                      $ref: "#/components/schemas/HTTPValidationError"
        /api/delivery/status-options:
          get:
            tags:
              - 送了么配送
            summary: Get Status Options
            description: 获取配送状态选项
            operationId: get_status_options_api_delivery_status_options_get
            responses:
              "200":
                description: Successful Response
                content:
                  application/json:
                    schema: {}
      components:
        schemas:
          CreateDeliveryRequest:
            properties:
              order_id:
                type: integer
                title: Order Id
              pickup_address:
                type: string
                title: Pickup Address
                default: 希希咖啡店（人民路88号）
              delivery_address:
                type: string
                title: Delivery Address
              customer_name:
                type: string
                title: Customer Name
              customer_phone:
                type: string
                title: Customer Phone
              notes:
                anyOf:
                  - type: string
                  - type: "null"
                title: Notes
            type: object
            required:
              - order_id
              - delivery_address
              - customer_name
              - customer_phone
            title: CreateDeliveryRequest
            description: 创建配送请求
          HTTPValidationError:
            properties:
              detail:
                items:
                  $ref: "#/components/schemas/ValidationError"
                type: array
                title: Detail
            type: object
            title: HTTPValidationError
          UpdateDeliveryStatusRequest:
            properties:
              status:
                type: string
                title: Status
            type: object
            required:
              - status
            title: UpdateDeliveryStatusRequest
            description: 更新配送状态请求
          ValidationError:
            properties:
              loc:
                items:
                  anyOf:
                    - type: string
                    - type: integer
                type: array
                title: Location
              msg:
                type: string
                title: Message
              type:
                type: string
                title: Error Type
            type: object
            required:
              - loc
              - msg
              - type
            title: ValidationError
