edition: 3.0.0
name: buy-me-a-coffee
access: '{{ access }}'
vars:
  region: '{{ region }}'
  name: '{{ agentRuntimeName }}'
  role: '{{ role }}'
  model_service_name: '{{ modelServiceName }}'
  model_name: '{{ modelName }}'
  # image: registry.${vars.region}.aliyuncs.com/ohyee/fc-demo:buy-me-a-coffee-251211-020725
  image: "cap-demo-public-registry.{{ if region.includes('cn-') }}cn-hangzhou{{ else }}ap-southeast-1{{ /if }}.cr.aliyuncs.com/cap-app/agentrun-demo:buy-me-a-coffee-251211-020725"

template:
  tpl:
    region: ${vars.region}
    role: ${vars.role}

    cpu: 2
    memorySize: 2048
    diskSize: 512
    timeout: 3600
    instanceConcurrency: 100

    runtime: custom-container
    customContainerConfig:
      image: ${vars.image}
      port: 8000
    environmentVariables:
      TZ: Asia/Shanghai
      AGENTRUN_MODEL_NAME: ${vars.model_service_name}
      MODEL_NAME: ${vars.model_name}

    logConfig: auto
    triggers:
      - triggerName: httpTrigger
        triggerType: http
        triggerConfig:
          authType: anonymous
          methods:
            - GET
            - POST
            - PUT
            - DELETE

  tpl-agent:
    region: ${vars.region}
    role: ${vars.role}
    agent:
      role: ${vars.role}
      customContainerConfig:
        image: ${vars.image}
        port: 9000

      cpu: 1.0
      memory: 2048

      port: 8000
      instanceConcurrency: 100

      logConfig: auto
      internetAccess: true
      environmentVariables:
        TZ: Asia/Shanghai
        AGENTRUN_MODEL_NAME: ${vars.model_service_name}
        MODEL_NAME: ${vars.model_name}

      endpoints:
        - name: Default
          version: LATEST

resources:
  coffee-api:
    component: fc3
    extend:
      name: tpl
    actions:
      complete-deploy:
        - plugin: cap-tool-plugin@0.0.8
          args: # 插件的参数
            schema: ${file(./coffee.yaml)}
    props:
      functionName: ${vars.name}_coffee_api
      description: 'Buy Me A Coffee - 希希咖啡店 API'
      customContainerConfig:
        command:
          - python
          - -m
          - coffee.main

  coffee-agent:
    component: agentrun
    extend:
      name: tpl-agent
    props:
      agent:
        name: ${vars.name}_coffee_agent
        description: 'Buy Me A Coffee - 希希咖啡店 Agent'
        customContainerConfig:
          command:
            - "python"
            - "-m"
            - coffee.a2a
        environmentVariables:
          # 自己的 endpoint 地址
          COFFEE_A2A_URL: "https://${config('AccountID')}.agentrun-data.${vars.region}.aliyuncs.com/agent-runtimes/${this.props.agent.name}/endpoints/Default/invocations"
          COFFEE_TOOLSET_NAME: 'xixi-coffee-api'

  delivery-api:
    component: fc3
    extend:
      name: tpl
    actions:
      complete-deploy:
        - plugin: cap-tool-plugin@0.0.8
          args: # 插件的参数
            schema: ${file(./delivery.yaml)}
    props:
      functionName: ${vars.name}_delivery_api
      description: 'Buy Me A Coffee - 送了么配送 API'
      customContainerConfig:
        command:
          - python
          - -m
          - delivery.main

  delivery-agent:
    component: agentrun
    extend:
      name: tpl-agent
    props:
      agent:
        name: ${vars.name}_delivery_agent
        description: 'Buy Me A Coffee - 送了么配送 Agent'
        customContainerConfig:
          command:
            - "python"
            - -m
            - delivery.a2a
        environmentVariables:
          # 自己的 endpoint 地址
          DELIVERY_A2A_URL: "https://${config('AccountID')}.agentrun-data.${vars.region}.aliyuncs.com/agent-runtimes/${this.props.agent.name}/endpoints/Default/invocations"
          DELIVERY_TOOLSET_NAME: delivery-api

  assistant-agent:
    component: agentrun
    extend:
      name: tpl-agent
    props:
      agent:
        name: ${vars.name} # 为了方便前端识别，这里不加后缀
        description: 'Buy Me A Coffee - 寒小艾 Agent'
        customContainerConfig:
          command:
            - "python"
            - "-m"
            - gateway.main
        environmentVariables:
          DELIVERY_API_URL: '${resources.delivery-api.output.url.system_url}'
          COFFEE_API_URL: '${resources.coffee-api.output.url.system_url}'
          A2A_URLS: "${resources.coffee-agent.output.agent.endpoints.0.url}/.well-known/agent-card.json,${resources.delivery-agent.output.agent.endpoints.0.url}/.well-known/agent-card.json"

  main_web:
    component: fc3
    props:
      region: ${vars.region}

      functionName: ${vars.name}_web
      description: 'Buy Me A Coffee - 前端页面'

      runtime: custom
      code: ./frontend/dist
      customRuntimeConfig:
        command:
          - node
          - index.cjs

      cpu: 0.5
      memory: 512
      diskSize: 512
      timeout: 3600

      port: 9000
      instanceConcurrency: 100

      internetAccess: true

      environmentVariables:
        # ENDPOINT: '${resources.assistant-agent.output.url.system_url}'
        ENDPOINT: "https://${config('AccountID')}.agentrun-data.${vars.region}.aliyuncs.com/agent-runtimes/${resources.assistant-agent.output.agent.name}/endpoints/Default/invocations"

      customDomain:
        protocol: 'HTTP'
        route:
          path: '/*'
          qualifier: 'LATEST'
        domainName: auto
