edition: 3.0.0
name: buy-me-a-coffee
access: '{{ access }}'
vars:
  region: 'cn-hangzhou'
  name: 'buy-me-a-coffee'
  role: "acs:ram::${config('AccountID')}:role/buy-me-a-coffee"
  model_name: 'model-68sWBa'

template:
  tpl:
    region: ${vars.region}
    role: ${vars.role}

    cpu: 2
    memorySize: 2048
    diskSize: 512
    timeout: 3600
    instanceConcurrency: 100
    customRuntimeConfig:
      port: 9000

    runtime: custom.debian11
    code: ./backend

    layers:
      - acs:fc:cn-hangzhou:1011863232026330:layers/buy-me-a-coffee/versions/1
    environmentVariables:
      PATH: /var/fc/lang/python3.12/bin:/code/python/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/code:/code/bin:/opt:/opt/bin
      LD_LIBRARY_PATH: /code:/code/lib:/usr/lib:/opt/lib:/usr/local/lib
      PYTHONPATH: /opt/python:/code/python:/code

      AGENTRUN_MODEL_NAME: ${vars.model_name}

    logConfig: auto
    triggers:
      - triggerName: httpTrigger
        triggerType: http
        triggerConfig:
          authType: anonymous
          methods:
            - GET
            - POST
            - PUT
            - DELETE
    
    provisionConfig:
        target: 0
        alwaysAllocateGPU: false
        alwaysAllocateCPU: false

  tpl-agent:
    region: ${vars.region}
    role: ${vars.role}

    agent:
      code:
        src: ./backend
        language: python3.12
        command:
          - python3
          - src/main.py

      cpu: 1.0
      memory: 2048

      port: 9000
      instanceConcurrency: 100

      internetAccess: true

      layers:
        - acs:fc:cn-hangzhou:${config('AccountID')}:layers/buy-me-a-coffee/versions/1
      environmentVariables:
        PATH: /var/fc/lang/python3.12/bin:/code/python/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/code:/code/bin:/opt:/opt/bin
        LD_LIBRARY_PATH: /code:/code/lib:/usr/lib:/opt/lib:/usr/local/lib
        PYTHONPATH: /opt/python:/code/python:/code

        AGENTRUN_MODEL_NAME: ${vars.model_name}
        
resources:
  coffee-api:
    component: fc3
    extend:
      name: tpl
    props:
      functionName: ${vars.name}_coffee_api
      description: 'Buy Me A Coffee - 希希咖啡店 API'
      customRuntimeConfig:
        command:
          - python3
          - -m
          - coffee.main

  coffee-agent:
    component: fc3
    extend:
      name: tpl
    props:
      functionName: ${vars.name}_coffee_agent
      description: 'Buy Me A Coffee - 希希咖啡店 Agent'
      customRuntimeConfig:
        command:
          - python3
          - -m
          - coffee.a2a
      environmentVariables:
        COFFEE_API_URL: '${resources.coffee-api.output.url.system_url}'
        COFFEE_A2A_URL: 'http://${this.props.functionName}.fcv3.${config("AccountID")}.${this.props.region}.fc.devsapp.net'

      customDomain:
        protocol: 'HTTP'
        route:
          path: '/*'
          qualifier: 'LATEST'
        domainName: auto
          
  delivery-api:
    component: fc3
    extend:
      name: tpl
    props:
      functionName: ${vars.name}_delivery_api
      description: 'Buy Me A Coffee - 送了么配送 API'
      customRuntimeConfig:
        command:
          - python3
          - -m
          - delivery.main
  
  delivery-agent:
    component: fc3
    extend:
      name: tpl
    props:
      functionName: ${vars.name}_delivery_agent
      description: 'Buy Me A Coffee - 送了么配送 Agent'
      customRuntimeConfig:
        command:
          - python3
          - -m
          - delivery.a2a
      environmentVariables:
        DELIVERY_API_URL: '${resources.delivery-api.output.url.system_url}'
        DELIVERY_A2A_URL: 'http://${this.props.functionName}.fcv3.${config("AccountID")}.${this.props.region}.fc.devsapp.net'

      customDomain:
        protocol: 'HTTP'
        route:
          path: '/*'
          qualifier: 'LATEST'
        domainName: auto
          
  assistant-agent:
    component: fc3
    extend:
      name: tpl
    props:
      functionName: ${vars.name}_assistant_agent
      description: 'Buy Me A Coffee - 寒小艾 Agent'
      customRuntimeConfig:
        command:
          - python3
          - -m
          - gateway.main
      environmentVariables:
        DELIVERY_API_URL: '${resources.delivery-api.output.url.system_url}'
        COFFEE_API_URL: '${resources.coffee-api.output.url.system_url}'
        A2A_URLS: '${resources.coffee-agent.output.url.system_url},${resources.delivery-agent.output.url.system_url}'
          
  web:
    component: fc3
    props:
      region: ${vars.region}

      functionName: ${vars.name}_web
      description: 'Buy Me A Coffee - 前端页面'

      runtime: custom
      code: ./frontend/dist
      customRuntimeConfig:
        command:
          - node
          - index.js

      cpu: 0.5
      memory: 512
      diskSize: 512
      timeout: 3600

      port: 9000
      instanceConcurrency: 100

      internetAccess: true

      environmentVariables:
        ENDPOINT: '${resources.assistant-agent.output.url.system_url}'

      customDomain:
        protocol: 'HTTP'
        route:
          path: '/*'
          qualifier: 'LATEST'
        domainName: auto
